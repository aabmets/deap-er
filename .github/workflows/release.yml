name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New package version (must be greater than the current pyproject version)
        required: true
        type: string
        default: "2.0.0"  # gha-version-default

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Require a version greater than pyproject.toml
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          uv run python <<'PY'  # NOSONAR --no-build would skip this package
          import os
          import sys
          from pathlib import Path

          from packaging.version import InvalidVersion, Version

          raw = os.environ["NEW_VERSION"].strip()
          current = None
          for line in Path("pyproject.toml").read_text().splitlines():
              if line.startswith("version = "):
                  current = line.split("=", 1)[1].strip().strip('"')
                  break
          if current is None:
              sys.exit("Could not read project.version from pyproject.toml")
          try:
              new = Version(raw)
              cur = Version(current)
          except InvalidVersion as exc:
              sys.exit(f"Invalid version: {exc}")
          if new <= cur:
              sys.exit(f"Version {raw} must be greater than current {current}")
          print(f"{raw} > {current}")
          PY

  bump:
    needs: gate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v10.0.1
      - name: Bump pyproject and workflow default
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          uv version "$NEW_VERSION"
          python3 -c "
          import os, re, sys
          from pathlib import Path
          path = Path('.github/workflows/release.yml')
          text = path.read_text()
          new = os.environ['NEW_VERSION']
          updated, n = re.subn(
              r'default: \"[^\"]+\"  # gha-version-default',
              f'default: \"{new}\"  # gha-version-default',
              text,
              count=1,
          )
          if n != 1:
              sys.exit(f'Failed to update version default (replacements={n})')
          path.write_text(updated)
          "
      - name: Commit version bump
        id: commit
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock .github/workflows/release.yml
          git commit -m "chore: bump version to $NEW_VERSION"
          git push
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
      actions: read
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: deap-er-dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
