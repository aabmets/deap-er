name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: New package version (greater than pyproject.toml, with Unreleased changelog notes)
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup UV package manager
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          version: "latest"

      - name: Require a version greater than pyproject.toml
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: |
          uv sync --frozen --only-group release --no-install-project
          .venv/bin/python tools/ci/check_release_version.py

      - name: Require Unreleased changelog notes
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: python3 tools/ci/changelog_release.py check

  pytest-codecov:
    needs: gate
    uses: ./.github/workflows/pytest-codecov.yml
    secrets: inherit

  bump:
    needs: pytest-codecov
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - name: Setup UV package manager
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.13"
          version: "latest"

      - name: Promote Unreleased changelog notes
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: python3 tools/ci/changelog_release.py promote

      - name: Bump pyproject version
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: uv version "$NEW_VERSION"

      - name: Commit version bump
        id: commit
        env:
          NEW_VERSION: ${{ inputs.version }}
          RELEASE_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock CHANGELOG.md
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin "HEAD:$RELEASE_BRANCH"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    needs: bump
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.bump.outputs.sha }}

  publish:
    needs: [build, bump]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Download build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: deap-er-dist
          path: dist

      - name: Publish to Python Package Index
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Require changelog notes for this version
        env:
          NEW_VERSION: ${{ inputs.version }}
        run: python3 tools/ci/changelog_release.py verify

      - name: Extract release notes
        id: extract-release-notes
        uses: ffurrer2/extract-release-notes@273da39a24fb7db106a35526c8162815faffd31d # v3.1.0
        with:
          changelog_file: CHANGELOG.md
          release_notes_file: ${{ github.workspace }}/release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ inputs.version }}
          name: deap-er ${{ inputs.version }}
          target_commitish: ${{ needs.bump.outputs.sha }}
          body_path: ${{ github.workspace }}/release_notes.md
          body: ${{ steps.extract-release-notes.outputs.release_notes }}
          files: |
            dist/*.whl
            dist/*.tar.gz
          fail_on_unmatched_files: true
