src = ["deap_er", "tests"]
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".ipynb_checkpoints",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pyenv",
    ".pytest_cache",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    ".vscode",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "site-packages",
    "venv",
    "docs"
]
line-length = 100
indent-width = 4
target-version = "py313"

[lint]
select = ["E", "F", "UP", "B", "SIM", "I", "D"]
ignore = [
    "F403",
    "F405",
    "B019",
    "SIM118",
    "D100",
    "D104",
]
fixable = ["ALL"]
unfixable = []
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

[lint.pydocstyle]
convention = "google"

[lint.per-file-ignores]
"**/__init__.py" = ["F401"]
"tests/**" = ["D"]
"deap_er/base/lint_hints.py" = ["D", "UP035"]
"deap_er/creator/lint_hints.py" = ["D"]
"deap_er/tools.py" = ["D"]
"deap_er/dtypes.py" = ["D"]
"**/*dtypes.py" = ["D"]

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"