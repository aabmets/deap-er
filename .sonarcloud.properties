# uv sync/run here install this package. --no-build would skip that.
# bun install must run Allure's postinstall. Allure is served on localhost HTTP.

# Match pyproject.toml requires-python / classifiers (not "all Python 3").
sonar.python.version=3.12, 3.13, 3.14

# Tests must not sit under default sonar.sources=.; list production roots instead.
sonar.sources=deap_er,examples
sonar.tests=tests

sonar.issue.ignore.multicriteria=e1,e2,e3,e4
sonar.issue.ignore.multicriteria.e1.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e1.resourceKey=**/.github/workflows/**
sonar.issue.ignore.multicriteria.e2.ruleKey=shell:S8541
sonar.issue.ignore.multicriteria.e2.resourceKey=**/tools/dev_scripts/**
sonar.issue.ignore.multicriteria.e3.ruleKey=shell:S6505
sonar.issue.ignore.multicriteria.e3.resourceKey=**/tools/dev_scripts/**
sonar.issue.ignore.multicriteria.e4.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e4.resourceKey=**/tools/dev_scripts/**
