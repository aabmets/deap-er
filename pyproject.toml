[project]
name = "deap-er"
version = "2.0.0"
description = "Distributed Evolutionary Algorithms in Python - Entirely Reworked"
authors = [{ name = "Mattias Aabmets", email = "mattias.aabmets@gmail.com" }]
requires-python = ">=3.10,<4"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = [
    "deap",
    "evolution",
    "evolutionary algorithms",
    "genetic algorithms",
    "genetic programming",
    "symbolic regression",
    "hypervolume",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Artificial Life",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: OS Independent",
]
dependencies = [
    "numpy>=2.0.1,<3",
    "scipy>=1.14.0,<2",
    "dill>=0.3.8,<0.4",
]

[project.urls]
Repository = "https://github.com/aabmets/deap-er"
Documentation = "https://deap-er.readthedocs.io"

[dependency-groups]
dev = [
    "coverage==7.16.0",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-mock==3.15.1",
    "pytest-xdist==3.8.0",
    "pytest-timeout==2.4.0",
    "ruff==0.16.5",
    "ty==0.0.78",
]

[tool.uv.build-backend]
module-name = ["deap_er"]
module-root = ""

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
cache_dir = ".cache"
console_output_style = "count"
filterwarnings = ["ignore::DeprecationWarning"]
testpaths = ["tests"]
session_timeout = 60
timeout_method = "thread"
addopts = [
    "--cov=deap_er",
    "--cov-report=html",
    "--no-cov-on-fail",
    "--alluredir=reports/allure-results",
    "--clean-alluredir",
    "--cov-report=html:.htmlcov",
    "--cov-report=json:reports/coverage.json",
    "--cov-report=markdown:reports/coverage.md",
    "--import-mode=importlib",
    "--numprocesses=auto",
    "--maxprocesses=8",
    "--dist=worksteal"
]
pythonpath = [".", "./deap_er"]

[tool.coverage.run]
branch = true
source = ["deap_er"]

[tool.coverage.report]
fail_under = 80
skip_empty = true
ignore_errors = true
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod"
]

[tool.coverage.html]
directory = ".htmlcov"
